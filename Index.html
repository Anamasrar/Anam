<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>For Coco 💗</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(135deg, #ffe4ef, #f3e5ff);
        font-family: Arial, sans-serif;
        overflow: hidden;
    }

    .card {
        text-align: center;
        background: rgba(255,255,255,0.75);
        padding: 45px 30px;
        border-radius: 30px;
        box-shadow: 0 10px 40px rgba(0,0,0,0.12);
        max-width: 350px;
        animation: pop 1s ease;
    }

    .heart {
        font-size: 70px;
        animation: beat 1s infinite;
    }

    h1 {
        color: #d85b91;
        font-size: 38px;
        margin: 15px 0;
    }

    p {
        color: #777;
        font-size: 18px;
        line-height: 1.6;
    }

    .love {
        color: #c94f86;
        font-weight: bold;
        font-size: 24px;
    }

    @keyframes beat {
        50% {
            transform: scale(1.2);
        }
    }

    @keyframes pop {
        from {
            transform: scale(0.7);
            opacity: 0;
        }
        to {
            transform: scale(1);
            opacity: 1;
        }
    }

    .sparkle {
        position: absolute;
        font-size: 22px;
        animation: float 5s linear infinite;
    }

    @keyframes float {
        from {
            transform: translateY(100vh);
            opacity: 0;
        }
        30% { opacity: 1; }
        to {
            transform: translateY(-10vh);
            opacity: 0;
        }
    }
</style>
</head>

<body>

<div class="sparkle" style="left:10%;">💗</div>
<div class="sparkle" style="left:30%; animation-delay:1s;">✨</div>
<div class="sparkle" style="left:70%; animation-delay:2s;">💕</div>
<div class="sparkle" style="left:90%; animation-delay:3s;">✨</div>

<div class="card">
    <div class="heart">❤️</div>

    <h1>Coco 🥹</h1>

    <p>
        I just wanted to tell you something...
    </p>

    <div class="love">
        I LOVE YOU 💗
    </div>

    <p>
        More than words can explain ✨
    </p>
</div>

</body>
</html>
